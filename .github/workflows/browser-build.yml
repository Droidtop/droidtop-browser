name: Browser build

# Builds droidtop's browser from the composition the stable line names: Iceraven at the pinned commit
# (plugin-line/lines/stable/line.json) with this plugin-core written over it, then droidtop/apply.sh, then
# Iceraven's own build steps. The APKs are signed with the key derived from the droidtop root
# (APK_KEYSTORE_*), the identity droidtop trusts the browser by.
on:
  push:
    branches: [plugin-core, 'plugin/**', 'ci/**']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: browser-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Recipe
        uses: actions/checkout@v5
        with:
          path: recipe

      # The adapter against droidtop's web.view contract (docs/contracts/web-view.json at the droidtop commit in
      # droidtop/droidtop.pin), before the long build: droidtop checks its own side against the same file.
      - name: web.view contract
        run: |
          set -eu
          pin=$(tr -d ' \n\r' < recipe/droidtop/droidtop.pin)
          curl -fsSL "https://raw.githubusercontent.com/Droidtop/droidtop/$pin/docs/contracts/web-view.json" -o "$RUNNER_TEMP/web-view.json"
          python3 -I recipe/droidtop/check_contract.py "$RUNNER_TEMP/web-view.json" recipe

      - name: Pinned upstream commit
        id: pin
        run: |
          echo "commit=$(jq -r .upstream.commit recipe/plugin-line/lines/stable/line.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version recipe/plugin-line/lines/stable/line.json)" >> "$GITHUB_OUTPUT"

      - name: Upstream
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pin.outputs.commit }}
          path: src
          submodules: true

      # droidtop's plugin AIDL, at the commit droidtop itself pins (droidtop's vendor/lib-plugins).
      - name: droidtop's plugin interface
        uses: actions/checkout@v5
        with:
          repository: Droidtop/lib-plugins
          ref: a95fc7b4cf6196eaec9dc29b4b16db6154d5a6af
          path: src/droidtop/vendor/lib-plugins

      - name: Compose
        run: |
          rsync -a --exclude .git recipe/ src/
          cd src && bash droidtop/apply.sh

      - name: Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Android SDK and the NDK Gradle skips
        working-directory: src
        run: ./automation/iceraven/install-sdk.sh

      - name: Iceraven's patches
        working-directory: src
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      # Firefox's WebCompat extension (site fixes Gecko needs), at the Firefox tag matching the build, where
      # feature-webcompat looks for it: the source under browser/extensions/webcompat, the build-time files under
      # mobile/android/webcompat_addon_generated_files. Iceraven ships without it (droidtop/webcompat.py says why).
      - name: Firefox's WebCompat extension
        working-directory: src
        run: |
          tag="FIREFOX-ANDROID_$(tr . _ < version.txt | tr -d '\n')_RELEASE"
          git clone -q --depth 1 --filter=blob:none --sparse --branch "$tag" https://github.com/mozilla-firefox/firefox.git "$RUNNER_TEMP/firefox"
          git -C "$RUNNER_TEMP/firefox" sparse-checkout set --no-cone 'browser/extensions/webcompat/*'
          mkdir -p browser/extensions
          cp -R "$RUNNER_TEMP/firefox/browser/extensions/webcompat" browser/extensions/webcompat
          python3 -m venv "$RUNNER_TEMP/webcompat-venv"
          "$RUNNER_TEMP/webcompat-venv/bin/pip" install -q jsonschema
          "$RUNNER_TEMP/webcompat-venv/bin/python" droidtop/webcompat.py browser/extensions/webcompat mobile/android/webcompat_addon_generated_files

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        working-directory: src
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: ./gradlew app:assembleForkRelease -PversionName=${{ steps.pin.outputs.version }}-dt.${{ github.run_number }} --stacktrace --no-daemon

      # The adapter must be in the APK, not just its manifest entries: the first releases built green without it and
      # crashed with ClassNotFoundException when droidtop opened a page (2026-11-22).
      - name: Check the adapter and the WebCompat extension are in the APK
        run: |
          for apk in src/gradle/build/app/outputs/apk/forkRelease/app-*-forkRelease*.apk; do
            python3 -I - "$apk" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          dex = b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
          need = [b"Ldev/droidtop/browser/WebViewActivity;", b"Ldev/droidtop/browser/DroidtopInterfaceService;",
                  b"dev.droidtop.pluginhost.IPluginRuntime"]
          missing = [n.decode() for n in need if n not in dex]
          # Firefox's WebCompat extension, which the first releases shipped without (NS_ERROR_FILE_NOT_FOUND on load).
          names = set(z.namelist())
          missing += [n for n in ("assets/extensions/webcompat/manifest.json", "assets/extensions/webcompat/run.js")
                      if n not in names]
          if not any(n.startswith("assets/extensions/webcompat/injections/generated/") for n in names):
              missing.append("assets/extensions/webcompat/injections/generated/")
          if missing:
              sys.exit(f"{sys.argv[1]}: missing {missing}")
          print(f"{sys.argv[1]}: adapter and WebCompat extension present")
          PY
          done

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -eu
          # The newest build-tools of whichever SDK has them: Iceraven's own (install-sdk.sh) or the runner's.
          tools=""
          for sdk in "$HOME/android-sdk/android-sdk-linux" "${ANDROID_HOME:-}"; do
            if [ -n "$sdk" ] && [ -d "$sdk/build-tools" ]; then
              tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
              [ -n "$tools" ] && break
            fi
          done
          [ -n "$tools" ] || { echo "no Android build-tools found"; exit 1; }
          echo "build-tools: $tools"
          ls -l src/gradle/build/app/outputs/apk/forkRelease/
          ks="$RUNNER_TEMP/browser.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          mkdir -p out
          for abi in arm64-v8a x86_64; do
            in=$(find src/gradle/build/app/outputs/apk/forkRelease -maxdepth 1 -name "app-$abi-forkRelease*.apk" | head -n 1)
            [ -n "$in" ] || { echo "no $abi APK was built"; exit 1; }
            "$tools/zipalign" -f -p 4 "$in" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --out "out/droidtop-browser-$abi.apk" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify --print-certs "out/droidtop-browser-$abi.apk" > "$RUNNER_TEMP/certs.txt"
            grep -E "Signer #1 certificate (DN|SHA-256)" "$RUNNER_TEMP/certs.txt" || cat "$RUNNER_TEMP/certs.txt"
          done
          rm -f "$ks"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: droidtop-browser-${{ steps.pin.outputs.version }}-dt.${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      # Every green build of plugin-core is a release, the one droidtop's "droidtop Browser" row installs and updates
      # from (the newest release's droidtop-browser-<abi>.apk, checked against the certificate droidtop pins).
      - name: Release
        if: github.ref == 'refs/heads/plugin-core'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.pin.outputs.version }}-dt.${{ github.run_number }}
        run: |
          gh release create "$TAG" out/*.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "droidtop Browser $TAG"             --notes "Iceraven at $(jq -r .upstream.commit recipe/plugin-line/lines/stable/line.json | cut -c1-12) (Fenix ${{ steps.pin.outputs.version }}) with droidtop's recipe at ${GITHUB_SHA::12}."
