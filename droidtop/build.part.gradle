
// droidtop Browser's plugin side (droidtop docs/plugin-api.md 3 G3a), appended by droidtop/apply.sh. Its sources are
// in app/src/main/java/dev/droidtop/browser and droidtop's AIDL is copied into app/src/main/aidl, the folders the
// build compiles by default: with AGP 9's built-in Kotlin, an extra java.srcDirs folder was not compiled at all, and the
// first builds shipped the manifest entries without the classes (ClassNotFoundException on the console, 2026-11-22).
android {
    buildFeatures {
        aidl = true
    }
}
